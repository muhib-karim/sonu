<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-labelledby="title desc">
  <title id="title">SONU</title>
  <desc id="desc">SONU: offline voice typing for Windows, macOS and Linux</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="0.55" stop-color="#151a3a"/>
      <stop offset="1" stop-color="#2a1f5c"/>
    </linearGradient>
    <linearGradient id="wave" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.82" cy="0.5" r="0.45">
      <stop offset="0" stop-color="#6366f1" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1280" height="320" fill="url(#bg)"/>
  <rect width="1280" height="320" fill="url(#glow)"/>

  <!-- Text -->
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <text x="96" y="160" font-size="96" font-weight="700" fill="#f8fafc" letter-spacing="6">SONU</text>
    <text x="100" y="210" font-size="26" fill="#c7d2fe">Private, offline voice typing for your desktop</text>
    <text x="100" y="256" font-size="20" fill="#94a3b8">Tauri v2 · Rust · React · Parakeet · Whisper · Moonshine</text>
  </g>

  <!-- Motif: microphone feeding a waveform that turns into typed text -->
  <g transform="translate(790 160)">
    <!-- microphone -->
    <rect x="-22" y="-62" width="44" height="80" rx="22" fill="none" stroke="#e0e7ff" stroke-width="6"/>
    <path d="M -38 0 a 38 38 0 0 0 76 0" fill="none" stroke="#e0e7ff" stroke-width="6" stroke-linecap="round"/>
    <line x1="0" y1="38" x2="0" y2="62" stroke="#e0e7ff" stroke-width="6" stroke-linecap="round"/>

    <!-- waveform bars -->
    <g fill="url(#wave)" transform="translate(70 0)">
      <rect x="0" y="-10" width="10" height="20" rx="5"/>
      <rect x="20" y="-28" width="10" height="56" rx="5"/>
      <rect x="40" y="-48" width="10" height="96" rx="5"/>
      <rect x="60" y="-22" width="10" height="44" rx="5"/>
      <rect x="80" y="-60" width="10" height="120" rx="5"/>
      <rect x="100" y="-34" width="10" height="68" rx="5"/>
      <rect x="120" y="-50" width="10" height="100" rx="5"/>
      <rect x="140" y="-18" width="10" height="36" rx="5"/>
      <rect x="160" y="-8" width="10" height="16" rx="5"/>
    </g>

    <!-- typed-text lines with caret -->
    <g transform="translate(270 -36)">
      <rect x="0" y="0" width="150" height="10" rx="5" fill="#e0e7ff" opacity="0.85"/>
      <rect x="0" y="30" width="190" height="10" rx="5" fill="#e0e7ff" opacity="0.6"/>
      <rect x="0" y="60" width="110" height="10" rx="5" fill="#e0e7ff" opacity="0.4"/>
      <rect x="120" y="52" width="4" height="26" rx="2" fill="#22d3ee"/>
    </g>
  </g>
</svg>
